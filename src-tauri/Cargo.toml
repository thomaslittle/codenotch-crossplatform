[package]
name = "codenotch-crossplatform"
version = "0.4.0"
description = "Cross-platform edge usage notch for coding assistants"
authors = ["Thomas"]
edition = "2021"

[lib]
name = "codenotch_crossplatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "fs", "macros", "rt"] }
dirs = "6"
walkdir = "2.5"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
ring = "0.17"
open = "5"
keyring = { version = "3.6.3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
